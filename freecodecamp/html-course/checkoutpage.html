<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Checkout Page</title>
  </head>
  <body>
    <h1>Checkout</h1>
    <section>
      <h2>Your Cart</h2>
      <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="This is Rubik's Cube 3x3.">
      <p>Rubik's Cube 3x3</p>
      <p>$29.99</p>
    </section>
    <section>
      <h2>Payment Information</h2>
      <form action="">
        <label for="card-name">Cardholder Name <span aria-hidden="true">*</span></label>
        <input type="text" id="card-name" name="card-name" required><br>
        <label for="card-number">Card Number <span aria-hidden="true">*</span></label>
        <input type="text" id="card-number" name="card-number" aria-describedby="card-number-help" required>
        <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>
        <Label for="expiry-date">Expiry Date <span aria-hidden="true">*</span></Label>
        <input type="text" id="expiry-date" name="expiry-date" placeholder="MM/YY" required><br>
        <label for="cvv-number">CVV <span aria-hidden="true">*</span></label>
        <input type="number" id="cvv-number" name="cvv-number" required>
      </form>
    </section>
  </body>
</html>
